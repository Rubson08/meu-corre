<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e8eaf0;--mut:#9aa0ab;--pri:#22c55e;--red:#ef4444;--amb:#f59e0b;--in:#0b0d11}

html,body{background:var(--bg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

.grande{font-size:30px!important;font-weight:800;text-align:center;letter-spacing:-.5px}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;background:var(--pri);color:#04120a;margin-top:16px}

#toast.erro{background:#7f1d1d}
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login .logo{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 14px}
.login h1{text-align:center;font-size:26px}
.login p{text-align:center;color:var(--mut);margin:6px 0 18px}
.gin{width:140px;padding:9px 10px;text-align:right;font-size:16px;font-weight:600}
.gin:disabled{opacity:.35}
.rodape{text-align:center;color:#555b66;font-size:12px;margin:24px 0 8px}

<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui os dados do projeto Supabase
   (Project Settings → API → Project URL e anon public key)
   ============================================================ */
const SUPABASE_URL = 'https://umthqrqfloznzdlbolui.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oTDj1fVLKKaAaH8dkf53hg_XngsscjF';

/* ============================================================ */
const configurado = !SUPABASE_URL.startsWith('COLE') && !SUPABASE_ANON_KEY.startsWith('COLE');
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const S = {
  user: null, plataformas: [], config: { meta_mensal_geral: 0 },
  aba: 'inicio', periodo: 'mes',
  histMes: null, histTab: 'recargas', histPlat: null, hist: { prod: [], rec: [], gas: [] },
  lancTipo: 'recarga', lancPlat: null, lancCat: 'Gasolina',
  contas: []
};
const CATS = ['Gasolina', 'Alimentação', 'Manutenção', 'Celular/Internet', 'Aluguel do veículo', 'Outros'];
const CORES = ['#22c55e', '#3b82f6', '#f59e0b', '#a855f7', '#ef4444', '#06b6d4', '#ec4899', '#eab308'];
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const DIAS_LONGO = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const diffD = (a, b) => Math.round((b - a) / 864e5);
const iniMes = d => new Date(d.getFullYear(), d.getMonth(), 1);
const fimMes = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
/* "Semana" = blocos do mês: dias 1–7, 8–14, 15–21, 22–28, 29–fim */
const semMes = d => {
  const i = Math.floor((d.getDate() - 1) / 7);
  const a = new Date(d.getFullYear(), d.getMonth(), 1 + i * 7);
  const b = new Date(Math.min(addD(a, 6), fimMes(d)));
  return [a, b, i + 1];
};
const fmtD = x => { const d = typeof x === 'string' ? dt(x) : x; return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const fmtIn = v => Number(v || 0).toFixed(2).replace('.', ',').replace(/,00$/, ',00');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const soma = (arr, f = x => x.valor) => arr.reduce((s, x) => s + Number(f(x) || 0), 0);
const noR = (s, a, b) => s >= iso(a) && s <= iso(b);
const plat = id => S.plataformas.find(p => p.id === id) || { nome: '(removida)', cor: '#666' };
const isQtd = p => p.medida_meta === 'quantidade';
const unid = p => p.nome_unidade || 'unid.';
const fmtP = (p, v) => isQtd(p) ? `${num(v)} ${unid(p)}` : brl(v);
const temMeta = p => p.tipo_meta !== 'sem_meta' && Number(p.valor_meta) > 0;
/* Meta que reinicia: cada vez que bate, recebe o valor do contrato e zera a contagem */
const repete = p => !!p.meta_repete && temMeta(p) && !isQtd(p);
const ciclos = (p, real) => { const m = Number(p.valor_meta), n = Math.floor((real + 1e-6) / m); return { n, resto: Math.max(0, real - n * m) }; };
/* Quantas vezes bateu a meta no mês (se a meta for semanal, soma semana a semana) */
function ciclosMes(p, prod, ref) {
  const meus = prod.filter(r => r.plataforma_id === p.id);
  if (p.tipo_meta !== 'semanal') return ciclos(p, somaProd(meus, r => noR(r.data, iniMes(ref), fimMes(ref)))).n;
  let n = 0, d = iniMes(ref);
  while (d <= fimMes(ref)) { const [a, b] = semMes(d); n += ciclos(p, somaProd(meus, r => noR(r.data, a, b))).n; d = addD(b, 1); }
  return n;
}
/* Quanto a plataforma deve pagar no mês */
const previstoMes = (p, prod, ref) => repete(p) ? ciclosMes(p, prod, ref) * Number(p.valor_contrato) : Number(p.valor_contrato);
const pago = c => soma(c.contas_pagamentos || []);
const resta = c => Math.max(0, Number(c.valor) - pago(c));
const somaProd = (lista, filtro) => soma(lista.filter(filtro), x => x.quantidade);

function parseValor(s) {
  s = String(s || '').replace(/[R$\s]/g, '');
  if (s === '') return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
let toastT;
function toast(msg, tipo) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (tipo ? ' ' + tipo : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600);
}
async function q(p) {
  const { data, error } = await p;
  if (error) { toast(traduzErro(error), 'erro'); throw error; }
  return data;
}
function traduzErro(e) {
  if (e.code === '23503') return 'Não dá para excluir: existem lançamentos ligados a este item.';
  if (/Invalid login/i.test(e.message)) return 'E-mail ou senha incorretos.';
  if (/Failed to fetch|NetworkError/i.test(e.message)) return 'Sem conexão com a internet.';
  return e.message;
}
function modal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.classList.add('on');
  m.onclick = e => { if (e.target === m) fecharModal(); };
}
function fecharModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
const cabModal = t => `<h2>${t}<button onclick="fecharModal()" aria-label="Fechar">×</button></h2>`;
function marcarChip(el) { el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); }
const chipsPlat = (lista, sel, acao) => `<div class="chips">${lista.map(p =>
  `<button class="chip ${sel === p.id ? 'on' : ''}" onclick="${acao}('${p.id}',this)"><span class="dot" style="background:${p.cor}"></span>${esc(p.nome)}</button>`).join('')}</div>`;

/* ---------- períodos e metas ---------- */
function rangePeriodo(per, H) {
  if (per === 'hoje') return [H, H];
  if (per === 'semana') return semMes(H).slice(0, 2);
  return [iniMes(H), fimMes(H)];
}
function periodoPlat(p, H) { return p.tipo_meta === 'semanal' ? semMes(H).slice(0, 2) : [iniMes(H), fimMes(H)]; }
function periodoAnterior(p, H) {
  if (p.tipo_meta === 'semanal') { const [a] = semMes(H); return semMes(addD(a, -1)).slice(0, 2); }
  const x = addD(iniMes(H), -1); return [iniMes(x), fimMes(x)];
}
function rotuloRange(per, a, b) {
  if (per === 'hoje') return `Hoje · ${DIAS_LONGO[a.getDay()]}, ${fmtD(a)}`;
  if (per === 'semana') return `Semana ${semMes(a)[2]} do mês · dias ${pad(a.getDate())} a ${pad(b.getDate())}`;
  return `${MESES[a.getMonth()]} · dias 01 a ${pad(b.getDate())}`;
}
/* Quantos dias para bater a meta no ritmo atual + quanto precisa por dia */
function projecao(real, meta, ini, fim, H, f = brl) {
  const falta = meta - real;
  if (falta <= 0.005) return { cls: 'ok', txt: `🎉 <b>Meta batida!</b>${falta < -0.005 ? ' Passou ' + f(-falta) + ' da meta.' : ''}` };
  const passados = Math.max(1, diffD(ini, H) + 1);
  const restam = Math.max(1, diffD(H, fim) + 1);
  const media = real / passados;
  let t, c;
  if (media > 0) {
    const n = Math.ceil(falta / media), quando = addD(H, n);
    if (quando <= fim) { c = 'ok'; t = `No seu ritmo (${f(media)}/dia) você bate a meta em <b>${n} dia${n > 1 ? 's' : ''}</b> — ${DIAS[quando.getDay()]} ${fmtD(quando)}.`; }
    else { c = 'alerta'; t = `No ritmo atual (${f(media)}/dia) não dá tempo: bateria só em ${fmtD(quando)}.`; }
  } else { c = 'alerta'; t = 'Nada lançado ainda neste período.'; }
  return { cls: c, txt: `${t}<br><span class="mut">Faltam <b>${f(falta)}</b> → ${f(falta / restam)}/dia nos ${restam} dia${restam > 1 ? 's' : ''} que restam (contando hoje).</span>` };
}
function projecaoCiclo(p, real, ini, fim, H) {
  const m = Number(p.valor_meta), v = Number(p.valor_contrato), { resto } = ciclos(p, real);
  const passados = Math.max(1, diffD(ini, H) + 1), restam = Math.max(1, diffD(H, fim) + 1), media = real / passados, falta = m - resto;
  let t, c;
  if (media > 0) {
    const n = Math.ceil(falta / media), quando = addD(H, n);
    if (quando <= fim) { c = 'ok'; t = `No seu ritmo (${brl(media)}/dia) bate a <b>próxima meta em ${n} dia${n > 1 ? 's' : ''}</b> — ${DIAS[quando.getDay()]} ${fmtD(quando)}.`; }
    else { c = 'alerta'; t = `No ritmo atual (${brl(media)}/dia) a próxima meta não fecha até ${fmtD(fim)}.`; }
    const prev = Math.floor((real + media * diffD(H, fim)) / m);
    t += `<br><span class="mut">Faltam <b>${brl(falta)}</b> → ${brl(falta / restam)}/dia. Previsão até ${fmtD(fim)}: bater <b>${prev}×</b> = ${brl(prev * v)}.</span>`;
  } else { c = 'alerta'; t = `Nada lançado ainda neste período.<br><span class="mut">Faltam <b>${brl(falta)}</b> para a primeira meta.</span>`; }
  return { cls: c, txt: t };
}
function cardMeta({ nome, cor, tag, real, meta, pr, anterior, f = brl, extra = '', antes = '' }) {
  const pct = meta > 0 ? Math.min(100, real / meta * 100) : 0;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:700"><span class="dot" style="background:${cor}"></span>${esc(nome)}</div>
      <span class="tag">${tag}</span></div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;gap:8px">

   INÍCIO

async function renderInicio() {
  const H = hoje(), main = $('#main');
  if (!main.innerHTML.includes('card')) main.innerHTML = '<div class="vazio">Carregando…</div>';
  const desdeAnt = iso(iniMes(addD(iniMes(H), -1))), desdeMes = iso(iniMes(H));
  const [prod, rec, gas, contas] = await Promise.all([
    q(sb.from('producao').select('plataforma_id,data,quantidade').gte('data', desdeAnt).limit(5000)),
    q(sb.from('recebimentos').select('plataforma_id,data,valor').gte('data', desdeMes).limit(5000)),
    q(sb.from('gastos').select('data,valor').gte('data', desdeMes).limit(5000)),

  const prodP = prod.filter(r => noR(r.data, a, b));

  const pagosPer = soma(contas.flatMap(c => c.contas_pagamentos || []).filter(p => noR(p.data, a, b)));

    <div class="kpis" style="border-top:1px solid var(--line);padding-top:12px">
      <div class="kpi"><small>Recebido</small><b class="ok">${brl(g)}</b></div>
      <div class="kpi"><small>Gastos</small><b class="neg">${brl(gs)}</b></div>
      <div class="kpi"><small>Sobrou</small><b class="${g - gs < 0 ? 'neg' : ''}">${brl(g - gs)}</b></div>
    </div>
    ${pagosPer > 0 ? `<div class="mut" style="margin-top:12px;font-size:13px;border-top:1px solid var(--line);padding-top:10px">Pago em contas no período: <b>${brl(pagosPer)}</b> · Sobra final: <b class="${g - gs - pagosPer < 0 ? 'neg' : 'ok'}">${brl(g - gs - pagosPer)}</b></div>` : ''}
  </div>`;

  if (devendo > 0) h += `<div class="card alertabox" onclick="ir('contas')">
    <div><div style="font-weight:700">Você ainda deve ${brl(devendo)}</div>
    <small class="mut">${pend.length} conta${pend.length > 1 ? 's' : ''} em aberto${vencidas ? ` · <span class="neg">${vencidas} vencida${vencidas > 1 ? 's' : ''}</span>` : ''}</small></div>
    <span class="alerta" style="font-size:22px">›</span></div>`;

  // ---- metas ----
  h += `<div class="titulo">Metas</div>`;
  if (!ativas.length) h += `<div class="card vazio">Cadastre as plataformas, quanto cada uma paga e a meta de cada uma.<button class="btn" onclick="editarPlataforma()">+ Cadastrar plataforma</button></div>`;
  const metaG = Number(S.config.meta_mensal_geral) || 0;
  if (metaG > 0) {

    const real = somaProd(prod, r => !isQtd(plat(r.plataforma_id)) && noR(r.data, ma, mb));
    const ant = addD(ma, -1), realAnt = somaProd(prod, r => !isQtd(plat(r.plataforma_id)) && noR(r.data, iniMes(ant), fimMes(ant)));
    h += cardMeta({ nome: 'Meta geral de recarga', cor: '#e8eaf0', tag: MESES[H.getMonth()], real, meta: metaG, pr: projecao(real, metaG, ma, mb, H),
      anterior: `${MESES[ant.getMonth()]}: ${brl(realAnt)} ${realAnt >= metaG ? '✓ bateu' : '✗ não bateu'}` });
  }
  const comMeta = ativas.filter(temMeta);
  for (const p of comMeta) {
    const [pa, pb] = periodoPlat(p, H), m = Number(p.valor_meta), f = v => fmtP(p, v);
    const real = somaProd(prod, r => r.plataforma_id === p.id && noR(r.data, pa, pb));
    const [qa, qb] = periodoAnterior(p, H);
    const ant = somaProd(prod, r => r.plataforma_id === p.id && noR(r.data, qa, qb));
    const sem = p.tipo_meta === 'semanal';
    if (repete(p)) {
      const { n, resto } = ciclos(p, real), na = ciclos(p, ant).n, v = Number(p.valor_contrato);
      h += cardMeta({ nome: p.nome, cor: p.cor, real: resto, meta: m, f,
        tag: `${sem ? 'Semana ' + semMes(H)[2] : 'Mês'} · meta reinicia`,
        antes: `<div style="display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;background:${n ? 'rgba(34,197,94,.1)' : 'var(--in)'};border-radius:10px;padding:9px 11px;margin-bottom:9px;font-size:14px">
          <span>${n ? `✅ Bateu <b>${n}×</b> → ${brl(n * v)}` : 'Ainda não bateu neste período'}</span><span class="mut">trouxe ${brl(real)}</span></div>`,
        pr: projecaoCiclo(p, real, pa, pb, H),
        anterior: `Paga ${brl(v)} a cada ${brl(m)} · ${sem ? 'semana' : 'mês'} anterior: bateu ${na}× (${brl(na * v)})` });
      continue;
    }
    h += cardMeta({ nome: p.nome, cor: p.cor, real, meta: m, f,
      tag: sem ? `Semana ${semMes(H)[2]} · ${fmtD(pa)}–${fmtD(pb)}` : `Meta mensal${isQtd(p) ? ' · ' + unid(p) : ''}`,
      pr: projecao(real, m, pa, pb, H, f),
      anterior: `${sem ? 'Semana' : 'Mês'} anterior: ${f(ant)} ${ant >= m ? '✓ bateu' : '✗ não bateu'}${Number(p.valor_contrato) > 0 ? ` · paga ${brl(p.valor_contrato)}/mês` : ''}` });
  }
  const semMeta = ativas.filter(p => !temMeta(p));
  if (semMeta.length) h += `<div class="card"><h2>Sem meta</h2>
    ${semMeta.map(p => `<div class="row"><div class="l"><span class="dot" style="background:${p.cor}"></span><div>${esc(p.nome)}<small>${Number(p.valor_contrato) > 0 ? 'paga ' + brl(p.valor_contrato) + '/mês' : ''}</small></div></div><b>${fmtP(p, somaProd(prodP, r => r.plataforma_id === p.id))}</b></div>`).join('')}</div>`;

  // ---- pagamentos do mês ----
  const pagantes = ativas.filter(p => Number(p.valor_contrato) > 0);
  if (pagantes.length) {
    const recMes = rec, prevP = {};
    pagantes.forEach(p => prevP[p.id] = previstoMes(p, prod, H));
    const prev = soma(pagantes, p => prevP[p.id]), recebido = soma(recMes);
    h += `<div class="titulo">Pagamentos de ${MESES[H.getMonth()]}</div><div class="card">

      <div class="bar"><i style="width:${prev ? Math.min(100, recebido / prev * 100) : 0}%;background:var(--pri)"></i></div>
      ${pagantes.map(p => {
        const rp = soma(recMes.filter(r => r.plataforma_id === p.id)), pv = prevP[p.id], ok = rp >= pv - 0.005;
        const sub = repete(p)
          ? (pv ? `bateu ${pv / p.valor_contrato}× · recebido ${brl(rp)} de ${brl(pv)}` : `paga ${brl(p.valor_contrato)} por meta batida`)
          : (rp > 0 ? 'recebido ' + brl(rp) + ' de ' : 'contrato ') + brl(p.valor_contrato);
        return `<div class="row"><div class="l"><span class="dot" style="background:${p.cor}"></span><div>${esc(p.nome)}<small>${sub}</small></div></div>
          ${ok && pv > 0 ? '<b class="ok">✓</b>' : !pv ? '<span class="mut">—</span>' : `<button class="btn sec pq" onclick="receberRapido('${p.id}',${Math.max(0, pv - rp)})">Recebi</button>`}</div>`;
      }).join('')}</div>`;
  }

  // ---- por plataforma no período ----
  const reaisP = prodP.filter(r => !isQtd(plat(r.plataforma_id)));
  if (reaisP.length && S.periodo !== 'mes') {
    const porP = {}; reaisP.forEach(r => porP[r.plataforma_id] = (porP[r.plataforma_id] || 0) + Number(r.quantidade));

      const p = plat(id); return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><div class="l"><span class="dot" style="background:${p.cor}"></span>${esc(p.nome)}</div><b>${brl(v)}</b></div>
      <div class="mini"><i style="width:${v / recargaP * 100}%;background:${p.cor}"></i></div></div>`; }).join('')}</div>`;
  }

  // ---- dia a dia ----
  if (S.periodo !== 'hoje') {
    const fim = b < H ? b : H, dias = [];
    for (let d = fim; d >= a; d = addD(d, -1)) {
      const s = iso(d);
      dias.push({ d, r: somaProd(prod, x => x.data === s && !isQtd(plat(x.plataforma_id))), gs: soma(gas.filter(x => x.data === s)) });

    h += `<div class="titulo">Recarga dia a dia</div><div class="card">${dias.map(x => `<div class="row" style="display:block">

      <span><b class="${x.r ? 'ok' : 'mut'}">${brl(x.r)}</b>${x.gs ? ` <small class="neg">gasto ${brl(x.gs)}</small>` : ''}</span></div>
      <div class="mini"><i style="width:${x.r / max * 100}%"></i></div></div>`).join('')}</div>`;
  }
  main.innerHTML = h;
}

async function salvarLanc() {
  const t = S.lancTipo, v = parseValor($('#fValor').value);
  if (!(v > 0)) return toast('Informe um valor válido', 'erro');
  const btn = $('#btnSalvar'); btn.disabled = true;
  try {
    const obs = $('#fObs').value.trim() || null, data = $('#fData').value;
    if (t === 'recarga') {
      const p = plat(S.lancPlat), d = data || iso(hoje());
      const ja = await q(sb.from('producao').select('id,quantidade,obs').eq('plataforma_id', p.id).eq('data', d).maybeSingle());
      if (ja) {
        const tot = Number(ja.quantidade) + v;
        await q(sb.from('producao').update({ quantidade: tot, obs: obs || ja.obs }).eq('id', ja.id));
        toast(`✓ Somado. ${p.nome} no dia ${fmtD(d)}: ${fmtP(p, tot)}`);
      } else {
        await q(sb.from('producao').insert({ plataforma_id: p.id, quantidade: v, data: d, obs }));
        toast(`✓ ${fmtP(p, v)} em ${p.nome}`);
      }
    } else if (t === 'recebi') {
      await q(sb.from('recebimentos').insert({ plataforma_id: S.lancPlat, valor: v, data: data || iso(hoje()), obs }));
      toast(`✓ ${brl(v)} recebido de ${plat(S.lancPlat).nome}`);
    } else if (t === 'gasto') {
      await q(sb.from('gastos').insert({ categoria: S.lancCat, valor: v, data: data || iso(hoje()), descricao: obs }));
      toast(`✓ Gasto de ${brl(v)} em ${S.lancCat}`);
    } else {
      const pessoa = $('#fPessoa').value.trim();
      if (!pessoa) return toast('Diga a quem você deve', 'erro');
      await q(sb.from('contas').insert({ pessoa, descricao: obs, valor: v, vencimento: data || null }));
      toast(`✓ Conta com ${pessoa} cadastrada`);
      $('#fPessoa').value = ''; $('#fData').value = '';
    }
    $('#fValor').value = ''; $('#fObs').value = '';
  } catch (e) { } finally { btn.disabled = false; }
}

  } else {
    const ps = S.plataformas.filter(p => p.ativa || prod.some(r => r.plataforma_id === p.id) || rec.some(r => r.plataforma_id === p.id));

/* Planilha do mês por plataforma: dia 1 a 7 = semana 1, 8 a 14 = semana 2... */
function gradeRecargas(m) {
  const ps = S.plataformas.filter(p => p.ativa || S.hist.prod.some(r => r.plataforma_id === p.id));
  if (!ps.length) return `<div class="card vazio">Nenhuma plataforma cadastrada.</div>`;
  if (!ps.find(p => p.id === S.histPlat)) S.histPlat = ps[0].id;
  const p = plat(S.histPlat), H = iso(hoje()), fm = fimMes(m), nd = fm.getDate();
  let h = `<div style="margin-bottom:12px">${chipsPlat(ps, S.histPlat, 'selHist')}</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mut">Total do mês</span><b id="gTot" style="font-size:22px"></b></div>
  ${temMeta(p) && p.tipo_meta === 'mensal' ? `<div class="bar"><i id="gBar" style="background:${p.cor}"></i></div><small class="mut" id="gMeta"></small>` : ''}
  <p class="mut" style="font-size:12px;margin-top:8px">Digite o que trouxe em cada dia. Salva sozinho ao sair do campo.</p></div>`;
  for (let s = 0; s * 7 < nd; s++) {
    const ini = 1 + s * 7, fim = Math.min(nd, ini + 6);
    h += `<div class="dia"><span>Semana ${s + 1} · dias ${pad(ini)} a ${pad(fim)}</span><span id="gSem${s}"></span></div><div class="card" style="padding:2px 14px">`;
    for (let d = ini; d <= fim; d++) {
      const dia = new Date(m.getFullYear(), m.getMonth(), d), di = iso(dia);
      const r = S.hist.prod.find(x => x.plataforma_id === p.id && x.data === di);
      h += `<div class="row" style="padding:7px 0"><span>Dia ${pad(d)} <small class="mut">${DIAS[dia.getDay()]}</small></span>
        <input class="gin" data-d="${di}" inputmode="${isQtd(p) ? 'numeric' : 'decimal'}" placeholder="${di > H ? '' : '0'}" ${di > H ? 'disabled' : ''}
          value="${r ? (isQtd(p) ? num(r.quantidade) : fmtIn(r.quantidade)) : ''}" onchange="salvarDia('${p.id}','${di}',this)"></div>`;
    }
    h += `</div>`;
  }
  setTimeout(atualizaGrade, 0);
  return h;
}
function atualizaGrade() {
  const p = plat(S.histPlat), m = S.histMes, nd = fimMes(m).getDate();
  const prod = S.hist.prod.filter(x => x.plataforma_id === p.id);
  const tot = soma(prod, x => x.quantidade);
  if ($('#gTot')) $('#gTot').textContent = fmtP(p, tot);
  if ($('#gBar') && repete(p)) {
    const { n, resto } = ciclos(p, tot);
    $('#gBar').style.width = Math.min(100, resto / p.valor_meta * 100) + '%';
    $('#gMeta').innerHTML = `${n ? `<span class="ok">✅ Bateu ${n}× → ${brl(n * p.valor_contrato)}</span> · ` : ''}Próxima meta: ${brl(resto)} de ${brl(p.valor_meta)} (faltam ${brl(p.valor_meta - resto)})`;
  } else if ($('#gBar')) {
    $('#gBar').style.width = Math.min(100, tot / p.valor_meta * 100) + '%';
    $('#gMeta').innerHTML = tot >= p.valor_meta ? `<span class="ok">🎉 Meta de ${fmtP(p, p.valor_meta)} batida!</span>` : `Meta ${fmtP(p, p.valor_meta)} · faltam ${fmtP(p, p.valor_meta - tot)}`;
  }
  for (let s = 0; s * 7 < nd; s++) {
    const ini = 1 + s * 7, fim = Math.min(nd, ini + 6), el = $('#gSem' + s); if (!el) continue;
    const st = soma(prod.filter(x => { const d = dt(x.data).getDate(); return d >= ini && d <= fim; }), x => x.quantidade);
    el.textContent = fmtP(p, st);
  }
}
async function salvarDia(pid, data, inp) {
  const raw = inp.value.trim(), v = raw === '' ? 0 : parseValor(raw);
  if (!(v >= 0)) { toast('Valor inválido', 'erro'); return; }
  const lista = S.hist.prod, idx = lista.findIndex(x => x.plataforma_id === pid && x.data === data);
  inp.style.borderColor = 'var(--amb)';
  try {
    if (v === 0) {
      if (idx >= 0) { await q(sb.from('producao').delete().eq('id', lista[idx].id)); lista.splice(idx, 1); }
    } else if (idx >= 0) {
      await q(sb.from('producao').update({ quantidade: v }).eq('id', lista[idx].id)); lista[idx].quantidade = v;
    } else {
      const novo = await q(sb.from('producao').insert({ plataforma_id: pid, data, quantidade: v }).select().single());
      lista.push(novo);
    }
    inp.style.borderColor = 'var(--pri)'; setTimeout(() => inp.style.borderColor = '', 900);
    atualizaGrade();
  } catch (e) { inp.style.borderColor = 'var(--red)'; }
}

async function excluirPlataforma(id) {
  if (!confirm('Excluir esta plataforma? Se já tiver lançamentos, desative em vez de excluir.')) return;
  try { await q(sb.from('plataformas').delete().eq('id', id)); await carregarBase(); fecharModal(); toast('Plataforma excluída'); render(); }
  catch (e) { if (e.code === '23503') toast('Ela tem lançamentos. Desmarque "Plataforma ativa" para escondê-la.', 'erro'); }
}
async function salvarMetaGeral() {
  const v = parseValor($('#mG').value || '0'); if (!(v >= 0)) return toast('Valor inválido', 'erro');
  try { await q(sb.from('config').upsert({ user_id: S.user.id, meta_mensal_geral: v })); S.config.meta_mensal_geral = v; toast('✓ Meta geral salva'); } catch (e) { }
}

/* ============================================================
   LOGIN / INICIALIZAÇÃO
   ============================================================ */
function telaLogin() {
  $('#header').style.display = 'none'; $('#nav').style.display = 'none';
  $('#main').innerHTML = `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Meu <span class="ok">Corre</span></h1>
    <p>Seus contratos, metas e contas num lugar só.</p>
    <form onsubmit="entrarLogin(event)"><label>E-mail</label><input id="lE" type="email" autocomplete="email" required>
    <label>Senha</label><input id="lS" type="password" autocomplete="current-password" required>
    <button class="btn" id="lB">Entrar</button></form></div>`;
}
async function entrarLogin(ev) {
  ev.preventDefault(); const b = $('#lB'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    const d = await q(sb.auth.signInWithPassword({ email: $('#lE').value.trim(), password: $('#lS').value }));
    S.user = d.user; await abrirApp();
  } catch (e) { b.disabled = false; b.textContent = 'Entrar'; }
}
async function carregarBase() {
  S.plataformas = await q(sb.from('plataformas').select('*').order('nome'));
  S.config = (await q(sb.from('config').select('*').maybeSingle())) || { meta_mensal_geral: 0 };
}
async function abrirApp() {
  $('#header').style.display = ''; $('#nav').style.display = '';
  await carregarBase();
  if (!S.plataformas.length) S.aba = 'ajustes';
  render();
}
async function sair() { await sb.auth.signOut(); S.user = null; telaLogin(); }

(async function init() {
  if (!configurado) {
    $('#main').innerHTML = '<div class="vazio" style="margin-top:20vh">⚙️ Falta configurar o Supabase.<br>Abra o <b>index.html</b> e preencha SUPABASE_URL e SUPABASE_ANON_KEY.</div>';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { S.user = session.user; try { await abrirApp(); } catch (e) { telaLogin(); } }
  else telaLogin();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.user && !$('#modal').classList.contains('on') && S.aba !== 'lancar' && !(S.aba === 'historico' && S.histTab === 'recargas')) render();
  });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
